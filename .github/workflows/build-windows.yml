name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - feature/**
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Scan i18n and Build frontend
        working-directory: apps/desktop
        env:
          STATIC_I18N_SCAN: "true"
        run: npm run build

      - name: Build Tauri Application
        working-directory: apps/desktop
        run: npx @tauri-apps/cli build --bundles nsis --config "{\"bundle\":{\"createUpdaterArtifacts\":false}}"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cursor-BYOK-Windows-Installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/cursor-byok-desktop.exe
